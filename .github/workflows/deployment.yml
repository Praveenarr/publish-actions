name: output information
on:
  push:
    branches:
      - main
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
      #   - name: Lint Code
      #    run: npm run lint
      - name: Test Code
        run: npm run test
  build:
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      script-file: ${{steps.publish.outputs.script-file}}
    steps:
      - name: Get Code new code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
      - name: Build  Project
        run: npm run  build
      - name: Pubish Js filename
        id: publish
        run: find dist/assests/*.js -type f -execdir echo   'script-file={}' >> $GITHUB_OUTPUT';'
      - name: upload atrifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: |
            dist
            package.json
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Get Build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-files
      - name: Output contents
        run: ls -R
      - name: output filename
        run: echo "${{needs.build.outputs.script-file}}"
      - name: deploy
        run: echo "deploying"
